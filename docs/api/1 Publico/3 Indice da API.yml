info:
  name: Indice da API
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/"
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Mapa de bolso do gateway. Use como ponto de partida; cada request da colecao
  detalha um caso.

  Rotas:

  | Metodo | Rota | Auth | Descricao |
  |---|---|---|---|
  | GET | `/` | nao | painel web (HTML) |
  | GET | `/health` | nao | `{"status":"ok"}` |
  | GET | `/events` | sim | stream SSE (aceita `?api_key=`) |
  | GET | `/api/devices` | sim | lista devices, IOs e fila |
  | GET | `/api/devices/{id}` | sim | detalhe do device |
  | PATCH | `/api/devices/{id}` | sim | renomeia |
  | POST | `/api/devices/{id}/io` | sim | `switch`: `state`; `number`/`text`: `value` |
  | GET | `/ws?device_id=` | sim | socket do dispositivo |

  Modelo de dados: um IO e `switch` (estado booleano, persiste) **ou**
  `number`/`text` (valor, nao persiste - so o kind). O firmware define o kind no
  `register`; o painel so mostra.

  Dois sentidos:
  - **Painel -> ESP**: `POST .../io` com `state` (switch) ou `value` (number/text).
    Vira `set_io` no WebSocket; 200 entregue agora, 202 enfileirado.
  - **ESP -> painel**: WebSocket `report` com `value`. Atualiza a memoria e o SSE,
    nunca o `state.json`.

  Fluxo completo para testar valor de texto:
  1. Placa conectada e registrada (Mensagens do Monitor Serial ou "Listar Dispositivos").
  2. `POST .../io` `{"io":"status","value":"menu"}` -> 200 entregue.
  3. O firmware consome com `takeText` e mostra no Serial:
     `[APP] texto recebido: menu`.

  `Content-Type` e JSON nas rotas `POST`/`PATCH`; erros vem como texto puro, exceto
  o 401 de `/api/*` (`{"error":"unauthorized"}`).
