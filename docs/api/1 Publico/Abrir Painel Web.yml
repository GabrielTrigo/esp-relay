info:
  name: Abrir Painel Web
  type: http
  seq: 2

http:
  method: get
  url: "{{baseUrl}}/"
  auth: inherit

settings:
  encodeUrl: false
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Retorna o HTML do painel. A chave é informada no campo da própria página e
  salva no localStorage do navegador.

  Este request espera HTML, não JSON — use "Preview" no Bruno ou abra no navegador.
