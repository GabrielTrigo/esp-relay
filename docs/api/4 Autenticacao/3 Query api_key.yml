info:
  name: Query api_key
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/devices?api_key={{apiKey}}"
  headers:
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

docs: |-
  Variante por querystring: `?api_key=<chave>`.

  Existe principalmente para o `EventSource` do navegador (ver "Stream SSE do
  estado"). Em API/curl prefira o header: a chave na querystring aparece em logs
  de proxy e no historico do navegador.

  Rotas que **nao** pedem chave: `GET /` (painel) e `GET /health`.
