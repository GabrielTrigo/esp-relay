info:
  name: WebSocket - ping
  type: websocket
  seq: 5

websocket:
  url: "ws://localhost:8080/ws?device_id={{deviceId}}&api_key={{apiKey}}"
  message:
    type: text
    data: |-
      {"type":"ping"}
  auth: inherit

settings:
  timeout: 0
  keepAliveInterval: 0

docs: |-
  Keep-alive. O servidor responde `{"type":"pong"}` e atualiza `last_seen` apenas
  em memoria (nao reescreve o `state.json` a cada ping).

  Sem nenhuma mensagem por 90 s o servidor fecha o socket.

  Use para segurar o socket aberto no Bruno enquanto testa pelo painel.
