; Exemplo: LEDs, LDR e OLED com IOs de valor.
;
; A lib IotDevice entra como dependência de pasta (symlink=true): o exemplo
; compila a partir de um clone, apontando dois níveis acima para a raiz do
; repositório, sem sofrer a varredura de lib_extra_dirs.
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
monitor_speed = 115200
lib_deps =
  links2004/WebSockets@^2.7.3
  bblanchon/ArduinoJson@^7.4.3
  olikraus/U8g2
  symlink://../../
; Logs da lib ficam desligados em produção: -DIOT_LOG_ATIVO despeja set_io
; e ack no Serial a cada comando. Ligue só ao depurar por este ambiente.
; build_flags = -DIOT_LOG_ATIVO
