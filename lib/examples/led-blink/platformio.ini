; Projeto do exemplo (PlatformIO).
; A lib IotDevice é dependência por caminho de pasta (symlink=true): funciona a
; partir de um clone, sem editar caminho e sem a varredura que lib_extra_dirs
; faz na raiz do repositório (ela compilaria os .pio internos de cada exemplo).
[env:nodemcuv2]
platform = espressif8266
board = nodemcuv2
framework = arduino
lib_deps =
  links2004/WebSockets@^2.7.3
  bblanchon/ArduinoJson@^7.4.3
  symlink://../../

; Testes do protocolo e do núcleo no PC (sem placa).
; Requer `gcc`/`g++` no PATH (MinGW-w64 ou MSYS2):
;   pio test -e native            # todos
;   pio test -e native -f core    # só o núcleo (apply/ack/sync)
[env:native]
platform = native
test_framework = unity
lib_compat_mode = off
lib_deps =
  bblanchon/ArduinoJson@^7.4.3
build_flags =
  -std=gnu++17
  -DIOT_DEVICE_HOST_TEST
  -DIOT_TEST_AMBIENTE
  -I../../lib/src
